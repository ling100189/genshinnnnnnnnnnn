 Wiki 最新修訂為準。"},{"id":"wiki-ys-063","region":"納塔","location":"納塔-聖火競技場·楚汶市集","title":"妙影在手","description":"旅行者在聖火競技場遇見一位璃月詩人子澄。","achievement":"妙手採風","achievementUrl":"https://wiki.biligame.com/ys/天地萬象","task":"","taskUrl":"","workflow":["與子澄對話","在指定時間拍攝特佩利舞台、訊使長屋或金貝樂棚","向子澄回報"],"conditions":[{"text":"拍攝時間：特佩利舞台 11:00–13:00；","checked":false},{"text":"訊使長屋 17:00–18:00；","checked":false},{"text":"金貝樂棚 6:00–8:00。","checked":false}],"achieved":false,"source":"https://wiki.biligame.com/ys/委託成就","sourceUpdated":"2026-02-09","sourceLicense":"CC BY-NC-SA 4.0","sourceNote":"依 Wiki 委託成就頁整理；請以遊戲實際內容及 Wiki 最新修訂為準。"}];let data=[];const $=x=>document.getElementById(x);const src='https://wiki.biligame.com/ys/委託成就',au='https://wiki.biligame.com/ys/天地萬象',tu='https://wiki.biligame.com/ys/委託任務';
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function render(){let regs=[...new Set(data.map(x=>x.region||'未分類'))],old=$('region').value;$('region').innerHTML='<option value="">全部國家</option>'+regs.map(x=>`<option>${esc(x)}</option>`).join('');$('region').value=regs.includes(old)?old:'';let q=$('search').value.toLowerCase(),r=$('region').value,s=$('state').value;
let shown=data.filter(x=>(!r||x.region===r)&&JSON.stringify(x).toLowerCase().includes(q)&&(s==='all'||(s==='done'?x.achieved:s==='todo'?!x.achieved:(x.conditions||[]).some(c=>!c.checked))));
let done=data.filter(x=>x.achieved).length,checks=data.reduce((a,x)=>a+(x.conditions||[]).filter(c=>c.checked).length,0),all=data.reduce((a,x)=>a+(x.conditions||[]).length,0);
$('summary').textContent=`目前整理 ${data.length} 筆委託線索，成就與前置條件可以分開追蹤。`;$('count').textContent=`委託 ${data.length} 筆`;$('achcount').textContent=`成就已取得 ${done} 筆`;$('checkcount').textContent=`條件確認 ${checks}/${all}`;
$('list').innerHTML=shown.length?shown.map(x=>`<article class="entry"><span class="location">${esc(x.region||'未分類')}・${esc(x.location)}</span> <span class="tag" style="background:${x.achieved?'var(--green)':'var(--pink)'}">${x.achieved?'成就已取得':'成就待補'}</span><h2>委託名稱：${esc(x.title)}</h2>${x.description?`<p>說明：${esc(x.description)}</p>`:''}
${x.achievement?`<div class="section"><h3>相關成就</h3>${x.achievement.split('；').map(a=>`<div><a href="${esc(x.achievementUrl||au)}" target="_blank" rel="noopener">${esc(a)}</a></div>`).join('')}</div>`:''}
${x.task?`<div class="section"><h3>關聯任務</h3>${x.task.split('；').map(a=>`<div><a href="${esc(x.taskUrl||tu)}" target="_blank" rel="noopener">${esc(a)}</a></div>`).join('')}</div>`:''}
${x.workflow?.length?`<div class="section"><h3>委託流程</h3><ul class="checks">${x.workflow.map(a=>`<li>・${esc(a)}</li>`).join('')}</ul></div>`:''}
${x.conditions?.length?`<div class="section"><h3>前置條件／查漏清單</h3><ul class="checks">${x.conditions.map((c,i)=>`<li><input type="checkbox" data-check="${i}" data-id="${x.id}" ${c.checked?'checked':''}><span class="${c.checked?'checked':''}">${esc(c.text)}</span></li>`).join('')}</ul></div>`:''}
<div class="foot"><span class="hint">${(x.conditions||[]).filter(c=>c.checked).length}/${(x.conditions||[]).length} 條條件已確認</span><div class="actions"><button data-act="toggle" data-id="${x.id}">${x.achieved?'取消已取得':'標記成就已取得'}</button><button data-act="edit" data-id="${x.id}">編輯</button><button data-act="del" data-id="${x.id}">刪除</button></div></div><div class="hint" style="margin-top:8px">資料來源：<a href="${esc(x.source||src)}" target="_blank">原神 WIKI 委託成就</a></div></article>`).join(''):'<div class="empty">沒有符合條件的委託。<br>可以調整篩選，或新增一筆線索 ♡</div>'}
function open(x){$('form').reset();$('id').value=x?.id||'';$('formtitle').textContent=x?'編輯委託':'新增委託';if(x){$('reg').value=x.region||'';$('loc').value=x.location||'';$('title').value=x.title||'';$('desc').value=x.description||'';$('ach').value=x.achievement||'';$('task').value=x.task||'';$('workflow').value=(x.workflow||[]).join('\\n');$('conditions').value=(x.conditions||[]).map(c=>c.text).join('\\n')}$('dlg').showModal()}
$('add').onclick=()=>open();$('cancel').onclick=()=>$('dlg').close();$('form').onsubmit=e=>{e.preventDefault();let id=$('id').value,old=data.find(x=>x.id===id),conds=$('conditions').value.split('\\n').map(x=>x.trim()).filter(Boolean).map(t=>({text:t,checked:old?.conditions?.find(c=>c.text===t)?.checked||false}));let x={id:id||crypto.randomUUID(),region:$('reg').value.trim(),location:$('loc').value.trim(),title:$('title').value.trim(),description:$('desc').value.trim(),achievement:$('ach').value.trim(),achievementUrl:au,task:$('task').value.trim(),taskUrl:tu,workflow:$('workflow').value.split('\\n').map(x=>x.trim()).filter(Boolean),conditions:conds,achieved:old?.achieved||false,source:src};if(id)data=data.map(a=>a.id===id?x:a);else data.unshift(x);save();$('dlg').close()};
$('list').onclick=e=>{let b=e.target.closest('button');if(!b)return;let x=data.find(a=>a.id===b.dataset.id);if(!x)return;if(b.dataset.act==='edit')return open(x);if(b.dataset.act==='toggle')x.achieved=!x.achieved;if(b.dataset.act==='del'&&confirm('確定刪除這筆委託？'))data=data.filter(a=>a.id!==x.id);save()};
$('list').onchange=e=>{let c=e.target;if(!c.matches('[data-check]'))return;let x=data.find(a=>a.id===c.dataset.id);if(x?.conditions[c.dataset.check])x.conditions[c.dataset.check].checked=c.checked;save()};
$('search').oninput=render;$('region').onchange=render;$('state').onchange=render;
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({schemaVersion:2,game:'原神',data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='genshin-achievement-clues-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text()),incoming=Array.isArray(j)?j:(j.data||j.records);if(!Array.isArray(incoming))throw Error('找不到 data 陣列');if(confirm(`匯入 ${incoming.length} 筆資料？將與現有資料合併。`)){let ids=new Set(data.map(x=>x.id));data.push(...incoming.map((x,i)=>({...x,id:ids.has(x.id)?crypto.randomUUID():x.id||crypto.randomUUID(),region:x.region||'未分類',workflow:x.workflow||[],conditions:(x.conditions||[]).map(c=>typeof c==='string'?{text:c,checked:false}:c),achieved:!!x.achieved})));save();alert(`匯入完成，共新增 ${incoming.length} 筆。`)}}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};
try{const saved=localStorage.getItem(KEY);data=saved?JSON.parse(saved):INITIAL_DATA;if(!saved)localStorage.setItem(KEY,JSON.stringify(data))}catch{data=INITIAL_DATA}render();
</script></body></html>
